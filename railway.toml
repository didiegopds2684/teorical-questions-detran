# Railway: repositório com a API na raiz (Dockerfile).
# Adicione o plugin PostgreSQL; DATABASE_URL e PORT são injetados automaticamente.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
# Migrações + primeira conexão ao Postgres podem exceder 30s no cold start
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
